[build-system]
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "isitright"
dynamic = ["version"]
description = "Audit agent evals: find valid changes to the world under which a pass no longer holds"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "isitright contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "hypothesis>=6.115,<7",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "sqlglot>=27,<29",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
postgres = [
  "embedded-postgres>=18.6.3,<19",
  "psycopg[binary]>=3.2,<4",
]
duckdb = ["duckdb>=1.5,<2"]
bigquery = ["google-cloud-bigquery>=3.25,<4"]
trino = ["trino>=0.330,<1"]
mcp = ["mcp>=2.3,<3"]
# psutil: the memory watchdog of the data host on Linux and macOS (docs/data.md)
data = ["pandas>=2.2,<4", "psutil>=5.9,<8"]
data-schema = ["pandas>=2.2,<4", "pandera>=0.20,<1"]
parquet = ["pandas>=2.2,<4", "pyarrow>=15"]
# `all` leaves out `bigquery` and `trino` on purpose: they pull a cloud client stack that
# only native confirmation needs, and they constrain the lock file. The docs say so.
all = [
  "embedded-postgres>=18.6.3,<19",
  "psycopg[binary]>=3.2,<4",
  "duckdb>=1.5,<2",
  "mcp>=2.3,<3",
  "pandas>=2.2,<4",
  "pandera>=0.20,<1",
  "pyarrow>=15",
  "psutil>=5.9,<8",
]
dev = [
  "build>=1.2.2,<2",
  "duckdb>=1.5,<2",
  "embedded-postgres>=18.6.3,<19",
  "mcp>=2.3,<3",
  "mypy>=1.14,<2",
  "pandas>=2.2,<4",
  "pandera>=0.20,<1",
  "pyarrow>=15",
  "psutil>=5.9,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "psycopg[binary]>=3.2,<4",
  "ruff>=0.9,<1",
  "scipy>=1.11,<2",
  "twine>=6.1,<7",
]

[project.scripts]
isitright = "isitright.cli:app"

[project.urls]
Documentation = "https://docs.isitright.ai"
Repository = "https://github.com/isitright-ai/isitright"

[tool.hatch.build.targets.wheel]
packages = ["src/isitright"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github/workflows",
  "/docs",
  "/examples",
  "/schemas",
  "/src",
  "/tests",
  "/tools/export_schemas.py",
  "/tools/release.py",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = [
  "/.test-tmp",
  "/.tools",
  "/.venv",
  "/build",
  "/dist",
]

[tool.hatch.version]
path = "src/isitright/__about__.py"

[tool.uv]
# The version is read from __about__.py at build time, so an editable install must be rebuilt
# when it changes; otherwise the installed metadata keeps the old version.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/isitright/__about__.py" }]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=isitright --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["isitright"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
extend-exclude = ["dev"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Third-party code kept unchanged (see its provenance header) and the verbatim task text.
"examples/agents/shop/oracle.py" = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
"examples/agents/shop/shop_agent.py" = ["E", "SIM", "RUF", "B", "UP", "I"]
"examples/agents/shop/shop_service.py" = ["E501"]
# Gold and stand-in programs are source text in strings; their lines follow the program, not the file.
"examples/data/dabench/gold.py" = ["E501"]
"examples/data/dabench/programs.py" = ["E501"]

[tool.mypy]
# numpy's type stubs use Python 3.12 syntax, so mypy checks against 3.12 even though the runtime
# floor is 3.11 (CI still runs the tests on 3.11, 3.12 and 3.13).
python_version = "3.12"
strict = true
packages = ["isitright"]

[[tool.mypy.overrides]]
module = ["pandas.*", "pandera.*", "pyarrow.*", "scipy.*", "pandasai.*", "smolagents.*", "psutil.*"]
ignore_missing_imports = true

