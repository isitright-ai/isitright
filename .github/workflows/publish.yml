name: Publish distributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra all
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python tools/export_schemas.py --check
      - run: uv run pytest
      - run: uv build
      - run: uv run python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Read the package version from the built wheel
        shell: bash
        run: |
          wheel=$(find dist -name 'isitright-*.whl' -print -quit)
          version=${wheel##*/isitright-}
          version=${version%-py3-none-any.whl}
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install runtime dependencies from PyPI
        run: >-
          python -m pip install
          "hypothesis>=6.115,<7"
          "jsonschema>=4.23,<5"
          "pydantic>=2.10,<3"
          "pyyaml>=6.0.2,<7"
          "sqlglot>=27,<29"
          "typer>=0.15,<1"
      - name: Install the exact TestPyPI release
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --no-deps "isitright==$PACKAGE_VERSION" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 15
          done
      - run: python -c "import isitright, os; assert isitright.__version__ == os.environ['PACKAGE_VERSION']"
      - run: isitright --version

  publish-pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1


  release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Create the release for this version
        shell: bash
        run: |
          wheel=$(find dist -name 'isitright-*.whl' -print -quit)
          version=${wheel##*/isitright-}
          version=${version%-py3-none-any.whl}
          flags=""
          if [[ "$version" =~ (a|b|rc|dev)[0-9]*$ ]]; then flags="--prerelease"; fi
          gh release create "v$version" dist/* \
            --target "$GITHUB_SHA" \
            --title "isitright $version" \
            --generate-notes \
            $flags
