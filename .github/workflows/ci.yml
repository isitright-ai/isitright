name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # macOS (Apple Silicon) on every supported version: subprocesses use spawn there, the
          # memory limit is the watchdog, and paths and builds differ. A job cancelled with "The job
          # was not acquired by Runner of type hosted" is runner capacity: rerun it.
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra all
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python tools/export_schemas.py --check
      - run: uv run pytest
      - run: uv build
      - name: Verify wheel imports without network
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv pip install --reinstall --no-deps dist/*.whl
          .venv/bin/python -c "import isitright; print(isitright.__version__)"

